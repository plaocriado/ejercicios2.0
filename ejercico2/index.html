• Las noticias estarán formadas por el titulo y el texto.
• Debe haber una noticia de máxima relevancia y el resto serán de menor relevancia.
• La actividad se realizará en un solo documento, index.html.-->

    <title>Periodico</title>
</head>
<body>

    <h1>Noticia de máxima relevancia</h1>
    <p>Noticia mas importente</p>

    <h2>Noticia de menor relevancia 1</h2>
    <p>Texto de la noticia de menor relevancia 1...</p>

    <h2>Noticia de menor relevancia 2</h2>
    <p>Texto de la noticia de menor relevancia 2...</p>

    <h2>Noticia de menor relevancia 3</h2>

</body>
</html>
